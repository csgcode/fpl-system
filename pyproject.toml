[project]
name = "fpl-system"
version = "1.0.0"
description = "Deterministic FPL data tooling: fetch, snapshot, filter"
requires-python = ">=3.13"
dependencies = [
    "pydantic==2.11.7",
    "requests==2.32.5",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
